[project]
name = "tradingbot"
version = "0.1.0"
description = "Multi-instrument trading system prototype (backtest + demo/paper trading only)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
ibkr = ["ib_async>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradingbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
