<script>
const W=1920,H=1080,cv=document.getElementById('c'),ctx=cv.getContext('2d');
// Palette sampled from skew.net + logo SVG
const C={blue:'#3064FD',blue2:'#1f5eff',sky:'#38b5fe',ink:'#1d242f',navy:'#0e1118',navy2:'#151a24',tile:'#1b2130',white:'#ffffff',mist:'#f0f1f6',ice:'#e8efff',grey:'#5c6070',grey2:'#9aa0b0',line:'#dddddd',green:'#00c27d',red:'#ff5a5a',pink:'#ffdede'};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,x)=>a+(b-a)*x;
const eO=x=>1-Math.pow(1-x,3),eI=x=>x*x*x,eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eX=x=>x>=1?1:1-Math.pow(2,-10*x),eB=x=>{const a=1.70158,b=a+1;return 1+b*Math.pow(x-1,3)+a*Math.pow(x-1,2)};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const F={h:(n,w=600)=>`${w} ${n}px IT`,hi:(n,w=500)=>`${w} ${n}px ITi`,b:(n,w=500)=>`${w} ${n}px DM`};
const TL=window.TL,w_=(l,i)=>TL[l].start+TL[l].words[i][1];

// ---------- footage ----------
const IMG={},need=new Set();let collecting=false;const CNT=window.COUNTS;
function V(name,sec,loop=false){const n=CNT[name];let f=Math.floor(sec*30);f=loop?((f%n)+n)%n:cl(f,0,n-1);
  const src=`ff/${name}/${String(f+1).padStart(4,'0')}.jpg`;if(collecting){need.add(src);return null}return IMG[src]}
function still(src){if(collecting){need.add(src);return null}return IMG[src]}
function cover(img,x,y,w,h,zoom=1,px=.5,py=.5){if(!img)return;const s=Math.max(w/img.width,h/img.height)*zoom,iw=img.width*s,ih=img.height*s;
  ctx.drawImage(img,x+(w-iw)*px,y+(h-ih)*py,iw,ih)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function shadow(b=40,y=16,a=.16){ctx.shadowColor=`rgba(14,17,24,${a})`;ctx.shadowBlur=b;ctx.shadowOffsetY=y}
function noShadow(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0}

// word-by-word masked rise; o.times gives per-word start times
function line(segs,x,y,size,t,t0,o={}){
  const st=o.stagger??.06,du=o.dur??.6,out=o.out;
  const ws=[];segs.forEach(([s,f,c])=>{ctx.font=f;s.split(' ').forEach(w=>w&&ws.push({w,f,c,wd:ctx.measureText(w).width}))});
  ctx.font=segs[0][1];ctx.letterSpacing=(o.ls??-size*.02)+'px';const sp=ctx.measureText(' ').width+size*.06;
  ws.forEach(w=>{ctx.font=w.f;w.wd=ctx.measureText(w.w).width});
  const tot=ws.reduce((a,b)=>a+b.wd,0)+sp*(ws.length-1);
  let cx=o.align==='center'?x-tot/2:o.align==='right'?x-tot:x;
  ctx.save();ctx.beginPath();ctx.rect(0,y-size*1.08,W,size*1.42);ctx.clip();
  ws.forEach((w,i)=>{const ti=o.times?o.times[Math.min(i,o.times.length-1)]:t0+i*st;
    const k=eX(P(t,ti,ti+du));let dy=(1-k)*size*1.15;
    if(out!=null)dy-=eI(P(t,out+i*.025,out+i*.025+.32))*size*1.7;
    if(k>0){ctx.font=w.f;ctx.fillStyle=w.c;ctx.fillText(w.w,cx,y+dy)}
    cx+=w.wd+sp});
  ctx.restore();ctx.letterSpacing='0px';return tot;
}
function pill(txt,x,y,o={}){
  ctx.save();ctx.font=o.font??F.b(24,600);ctx.letterSpacing=(o.ls??0)+'px';
  const ic=o.icon?(o.h??52)*.62:0;const w=ctx.measureText(txt).width+(o.pad??26)*2+ic,h=o.h??52;const x0=x-(o.center?w/2:0);
  if(o.shadow)shadow(30,10,.18);rr(x0,y-h/2,w,h,o.r??h/2);ctx.fillStyle=o.bg??C.white;ctx.fill();noShadow();
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=1.5;ctx.stroke()}
  if(o.icon)o.icon(x0+(o.pad??26)+ic*.32,y,ic*.62);
  ctx.fillStyle=o.color??C.ink;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(txt,x0+(o.pad??26)+ic,y+1);ctx.restore();return w;
}
function eyebrow(txt,x,y,t,t0,col=C.grey,o={}){if(t<t0)return;ctx.save();ctx.font=F.b(o.size??22,600);ctx.letterSpacing=(o.ls??4)+'px';ctx.fillStyle=col;ctx.textAlign=o.align??'left';
  const n=Math.floor(cl((t-t0)*(o.cps??50),0,txt.length));ctx.fillText(txt.slice(0,n),x,y);ctx.restore()}

// ---------- Skew logo (exact SVG paths) ----------

 ht:new Path2D('M5.18,37.13a5.830,5.830,0,0,1,0,.59L32.31,53.56a6,6,0,0,1,3.870-1.43,6.140,6.140,0,0,1,1.060.1L43.61,41a6,6,0,0,1,4.570-9.880,6.390,6.390,0,0,1,1,.09l7.480-13.160a6,6,0,0,1,.1-8L39.25,0,0,22.66v8.53A6,6,0,0,1,5.18,37.13Z'),
 L:[new Path2D('M107.74,70.37a16.29,16.29,0,0,1-7-5.32A14.63,14.63,0,0,1,98,56.55h13.11A6.35,6.35,0,0,0,113,60.83a6.21,6.21,0,0,0,4.32,1.48,6.77,6.770,0,0,0,4.32-1.26,4.19,4.19,0,0,0,1.58-3.49,4.15,4.15,0,0,0-1.26-3.1,10.13,10.13,0,0,0-3.09-2,49.86,49.86,0,0,0-5.22-1.8,56.25,56.25,0,0,1-8-3,14.73,14.73,0,0,1-5.33-4.46,12.44,12.44,0,0,1-2.23-7.71,13.25,13.25,0,0,1,5.11-11.05c3.4-2.66,7.85-4,13.32-4s10,1.33,13.46,4a14.31,14.31,0,0,1,5.47,11.13H122.14a5.18,5.18,0,0,0-1.8-3.86,6.36,6.36,0,0,0-4.24-1.4,5.25,5.25,0,0,0-3.6,1.19,4.57,4.57,0,0,0,.93,7.23,37.65,37.65,0,0,0,7.2,3,67.09,67.09,0,0,1,8,3.16,15.2,15.2,0,0,1,5.29,4.4,11.73,11.73,0,0,1,2.23,7.41,14.58,14.58,0,0,1-2.19,7.850,15.39,15.39,0,0,1-6.38,5.61,21.69,21.69,0,0,1-9.86,2.09A26,26,0,0,1,107.74,70.37Z'),
  new Path2D('M168.22,71.67,156,54.82V71.67H143.67V18.39H156V47.84l12.17-16.35h15.19l-16.7,20.16,16.85,20Z'),
  new Path2D('M225.82,54.53H198a8.35,8.35,0,0,0,2.41,5.73,7.38,7.38,0,0,0,5.22,2A6.48,6.48,0,0,0,212,58.35h13.1a18,18,0,0,1-3.63,7.13,18.31,18.31,0,0,1-6.59,5A21.16,21.16,0,0,1,206,72.24a21.55,21.55,0,0,1-10.51-2.51,18,18,0,0,1-7.2-7.2,22.22,22.22,0,0,1-2.59-11,22.42,22.42,0,0,1,2.56-10.94,17.67,17.67,0,0,1,7.16-7.2A21.690,21.690,0,0,1,206,30.92a21.39,21.39,0,0,1,10.37,2.45,17.58,17.58,0,0,1,7.09,7A21.12,21.12,0,0,1,226,50.93,30.08,30.08,0,0,1,225.82,54.53Zm-12.38-6.84a6.34,6.34,0,0,0-2.16-5,8,8,0,0,0-5.4-1.87,7.78,7.78,0,0,0-5.220,1.8A8,8,0,0,0,198,47.69Z'),
  new Path2D('M290.19,31.49,279.32,71.67H265.71L259.37,45.6l-6.55,26.07H239.29L228.34,31.49h12.31l5.69,28.73,6.77-28.73h13L273,60.08l5.62-28.59Z')]};
const HC=[39.25,45.3],NODES=[[-0.4,37.1],[36.2,58.1],[48.2,37.1],[61.2,14.2]];
// hex: 0..1 pop, word: 0..1 letters, wordCol
function logo(cx,cy,s,o={}){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.translate(-HC[0],-HC[1]);
  const hx=o.hex??1;if(hx>0){ctx.save();ctx.translate(HC[0],HC[1]);const k=eB(cl(hx));ctx.scale(k,k);ctx.translate(-HC[0],-HC[1]);
    ctx.save();const kb=eO(P(hx,0,.7));ctx.translate(0,(1-kb)*14);ctx.fillStyle=C.blue;ctx.globalAlpha=kb;ctx.fill(LP.hb);ctx.restore();
    ctx.save();const kt=eO(P(hx,.15,.85));ctx.translate(0,(1-kt)*-14);ctx.fillStyle=C.sky;ctx.globalAlpha=kt;ctx.fill(LP.ht);ctx.restore();ctx.restore()}
  const wd=o.word??1;if(wd>0){LP.L.forEach((p,i)=>{const k=eX(P(wd,i*.12,i*.12+.6));if(k<=0)return;ctx.save();ctx.beginPath();ctx.rect(90,10,210,70);ctx.clip();ctx.translate(0,(1-k)*60);ctx.fillStyle=o.wordCol??C.ink;ctx.fill(p);ctx.restore()})}
  ctx.restore();
}
function hexPath(cx,cy,r,rot=0){ctx.beginPath();for(let i=0;i<6;i++){const a=rot+Math.PI/6+i*Math.PI/3;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
function hexIcon(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s/90,s/90);ctx.translate(-HC[0],-HC[1]);ctx.fillStyle=C.blue;ctx.fill(LP.hb);ctx.fillStyle=C.sky;ctx.fill(LP.ht);ctx.restore()}
// graph line + nodes (logo motif). pts in screen coords
function graph(pts,lw,r,col='#fff',alpha=1,prog=1){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();const n=pts.length-1,tot=prog*n;for(let i=0;i<=n;i++){if(i>tot+1)break;let [x,y]=pts[i];if(i>tot){const f=tot-(i-1);x=L(pts[i-1][0],x,f);y=L(pts[i-1][1],y,f)}i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
  pts.forEach((p,i)=>{if(i<=tot+.001){ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.fill()}});ctx.restore()}
function logoNodes(cx,cy,s){return NODES.map(([x,y])=>[cx+(x-HC[0])*s,cy+(y-HC[1])*s])}

// icons
function icPerson(x,y,s,col){ctx.save();ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y-s*.28,s*.22,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(x,y+s*.32,s*.38,s*.26,0,Math.PI,0);ctx.fill();ctx.restore()}
function icShop(x,y,s,col){ctx.save();ctx.fillStyle=col;ctx.fillRect(x-s*.38,y-s*.05,s*.76,s*.42);ctx.beginPath();ctx.moveTo(x-s*.46,y-s*.08);ctx.lineTo(x-s*.36,y-s*.4);ctx.lineTo(x+s*.36,y-s*.4);ctx.lineTo(x+s*.46,y-s*.08);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(x-s*.1,y+s*.08,s*.2,s*.29);ctx.restore()}
function icBank(x,y,s,col){ctx.save();ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-s*.45,y-s*.18);ctx.lineTo(x,y-s*.45);ctx.lineTo(x+s*.45,y-s*.18);ctx.closePath();ctx.fill();
  for(let i=0;i<4;i++)ctx.fillRect(x-s*.36+i*s*.24-s*.04,y-s*.12,s*.09,s*.4);ctx.fillRect(x-s*.45,y+s*.3,s*.9,s*.1);ctx.restore()}
function icPin(x,y,s,col){ctx.save();ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y-s*.12,s*.3,Math.PI*.85,Math.PI*2.15);ctx.lineTo(x,y+s*.45);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y-s*.12,s*.12,0,7);ctx.fill();ctx.restore()}
function icCheck(x,y,s,col){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=s*.16;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x-s*.3,y);ctx.lineTo(x-s*.08,y+s*.22);ctx.lineTo(x+s*.32,y-s*.22);ctx.stroke();ctx.restore()}
function icFlag(x,y,s){ctx.save();rr(x-s/2,y-s/2,s,s,s*.18);ctx.fillStyle='#ff0000';ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x-s*.1,y-s*.3,s*.2,s*.6);ctx.fillRect(x-s*.3,y-s*.1,s*.6,s*.2);ctx.restore()}

// ---------- split-flap ----------
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const FLIPS=Array.from({length:11},(_,i)=>0.42+i*0.3);
function flapHalf(ch,x,y,w,h,top,sy){ctx.save();ctx.beginPath();if(top)ctx.rect(x,y,w,h/2);else ctx.rect(x,y+h/2,w,h/2);ctx.clip();
  ctx.translate(x+w/2,y+h/2);ctx.scale(1,sy);rr(-w/2,-h/2,w,h,14);ctx.fillStyle=C.tile;ctx.fill();
  ctx.font=F.h(h*.66,700);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,0,h*.04);
  ctx.fillStyle='rgba(0,0,0,'+(top?.0:.18)+')';ctx.fillRect(-w/2,0,w,h/2);ctx.restore()}
function flapTile(nw,od,k,x,y,w,h){flapHalf(nw,x,y,w,h,true,1);flapHalf(k<.5?od:nw,x,y,w,h,false,1);
  if(k>0&&k<1){if(k<.5){const s=1-2*k;ctx.save();ctx.beginPath();ctx.rect(x-20,y-20,w+40,h/2+20);ctx.clip();ctx.translate(0,y+h/2);ctx.scale(1,s);ctx.translate(0,-(y+h/2));flapHalf(od,x,y,w,h,true,1);ctx.restore();ctx.fillStyle=`rgba(0,0,0,${.35*(2*k)})`;}
    else{const s=2*k-1;ctx.save();ctx.translate(0,y+h/2);ctx.scale(1,s);ctx.translate(0,-(y+h/2));flapHalf(nw,x,y,w,h,false,1);ctx.restore()}}
  ctx.fillStyle=C.navy;ctx.fillRect(x,y+h/2-2,w,4)}

// ---------- scenes ----------
const chartPts=()=>[0,1,2,3].map(i=>[1250+i*168,860]);
function morphPts(T){const k=eIO(P(T,4.02,4.7));const a=chartPts(),b=logoNodes(960,520,4.2);return a.map((p,i)=>[L(p[0],b[i][0],k),L(p[1],b[i][1],k)])}
const S=[
 {t0:0,t1:4.62,dark:1,f(T){ // idle year
   const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.navy2);g.addColorStop(1,C.navy);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
   // faint swiss grid
   ctx.save();ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;for(let x=140;x<W;x+=120){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.restore();

   line([['is a month you',F.h(96),C.white]],140,700,96,T,0,{times:[w_(1,0),w_(1,1),w_(1,2),w_(1,3)],out});
   line([["aren't getting",F.h(96),C.sky],['paid.',F.h(96),C.sky]],140,810,96,T,0,{times:[w_(1,4),w_(1,5),w_(1,6)],out});
   // board
   const fade=1-eIO(P(T,3.95,4.4)),bx=1250,by=260,tw=150,th=200;ctx.save();ctx.globalAlpha=eO(P(T,.05,.5))*fade;
   ctx.font=F.b(20,600);ctx.letterSpacing='5px';ctx.fillStyle=C.grey2;ctx.fillText('MONTH',bx,by-30);ctx.textAlign='right';ctx.fillText('2026',bx+3*tw+2*16,by-30);ctx.textAlign='left';
   let n=0;FLIPS.forEach(ft=>{if(T>=ft)n++});const k=n>0?P(T,FLIPS[n-1],FLIPS[n-1]+.16):1;
   const nw=MON[n%12],od=MON[(n+11)%12];for(let i=0;i<3;i++){const kk=cl(k*1.15-i*.08);flapTile(nw[i],od[i],kk,bx+i*(tw+16),by,tw,th)}
   ctx.font=F.b(20,600);ctx.letterSpacing='5px';ctx.fillStyle=C.grey2;ctx.fillText('INTEREST EARNED',bx,by+th+80);

   ctx.letterSpacing='-2px';ctx.font=F.h(84,600);ctx.fillStyle=pk>.02?`rgb(255,${Math.round(255-165*pk)},${Math.round(255-165*pk)})`:'#fff';ctx.fillText('0.00',bx,by+th+170);
   const nw2=ctx.measureText('0.00').width;ctx.font=F.h(40,600);ctx.fillStyle=C.grey2;ctx.fillText('CHF',bx+nw2+14,by+th+170);ctx.restore();
   // idle chart -> morphs to logo graph
   const pts=morphPts(T),mk=eIO(P(T,4.02,4.7));ctx.save();ctx.globalAlpha=eO(P(T,.3,.9));
   if(mk<.05){ctx.strokeStyle='rgba(255,255,255,.12)';ctx.setLineDash([4,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(1250,860);ctx.lineTo(1250+504,860);ctx.stroke();ctx.setLineDash([])}
   graph(pts,L(4,12.5,mk),L(9,25,mk),mk>0?'#fff':'rgba(255,255,255,.55)',L(.6,1,mk));ctx.restore();
 }},
 {t0:4.62,t1:7.72,f(T){ // logo reveal + Swiss platform
   const lt=T-4.62;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.navy2);g.addColorStop(1,C.navy);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

   const m=eIO(P(T,5.0,5.45)),cx=L(960,140+39.25*1.6,m),cy=L(520,240,m),s=L(4.2,1.6,m);

   // headline
   line([["Switzerland's",F.h(104),C.ink]],140,520,104,T,0,{times:[w_(2,2)]});
   line([['Member Lending',F.h(104),C.blue]],140,640,104,T,0,{times:[w_(2,3),w_(2,4)]});

   // swiss card
   const ck=eX(P(T,5.5,6.1));if(ck>0){const x=1000,y=150,w=L(600,800,ck),h=L(560,700,ck),xx=x+(800-w)/2,yy=y+(700-h)/2;
