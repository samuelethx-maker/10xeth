<style>

<body><canvas id="c"></canvas>
<script src="vo/tl.js"></script><script src="ff/counts.js"></script><script src="horse.js"></script>
<script>
const SC=+(new URLSearchParams(location.search).get('s')||1);
const W=1920,H=1080,cv=document.getElementById('c');cv.width=W*SC;cv.height=H*SC;const ctx=cv.getContext('2d');
// Brand tokens sampled from hoplite.sh
const C={bg:'#f4f4f4',bg2:'#eaeaea',ink:'#121212',ink2:'#252525',grey:'#8a8a8a',grey2:'#929292',line:'#e3e3e3',white:'#ffffff',
  orange:'#ff3616',orange2:'#ff6a4d',peach:'#ffd6cc',cyan:'#6ec6d6',green:'#2fb67c',purple:'#8b5cf6',amber:'#e5a50a',red:'#ef4444',dark:'#0d0d0d'};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,x)=>a+(b-a)*x;
const eO=x=>1-Math.pow(1-x,3),eI=x=>x*x*x,eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eQ=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const eX=x=>x>=1?1:1-Math.pow(2,-10*x),eXI=x=>x<=0?0:Math.pow(2,10*x-10),eB=x=>{const a=1.70158,b=a+1;return 1+b*Math.pow(x-1,3)+a*Math.pow(x-1,2)};
const eS=x=>x>=1?1:1-Math.pow(2,-9*x)*Math.cos(x*Math.PI*2.6); // soft spring
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const F={d:(n,w=500)=>`${w} ${n}px FD`,s:(n,w=500)=>`${w} ${n}px FS`,i:n=>`${n}px RI`,r:n=>`${n}px RR`,m:(n,w=450)=>`${w} ${n}px GM`,bb:n=>`${n}px BB`};
const TL=window.TL,w_=(l,i)=>TL[l].start+TL[l].words[i][1];

// ---------- media ----------
const IMG={},need=new Set();let collecting=false;const CNT=window.COUNTS;
function V(name,sec){const n=CNT[name];const f=cl(Math.floor(sec*30),0,n-1);return still(`ff/${name}/${String(f+1).padStart(4,'0')}.jpg`)}
function still(src){if(collecting){need.add(src);return null}return IMG[src]}
function cover(img,x,y,w,h,zoom=1,px=.5,py=.5){if(!img)return;const s=Math.max(w/img.width,h/img.height)*zoom,iw=img.width*s,ih=img.height*s;ctx.drawImage(img,x+(w-iw)*px,y+(h-ih)*py,iw,ih)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function shadow(b=40,y=16,a=.14,c='18,18,18'){ctx.shadowColor=`rgba(${c},${a})`;ctx.shadowBlur=b*SC;ctx.shadowOffsetY=y*SC}
function noShadow(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0}
const HORSE=new Path2D(window.HORSE_D); // viewBox 11.1844
function horse(x,y,s,col=C.ink){ctx.save();ctx.translate(x,y);ctx.scale(s/11.1844,s/11.1844);ctx.fillStyle=col;ctx.fill(HORSE);ctx.restore()}

// word-by-word masked rise. segs: [[text,font,color|gradient-fn]]
function line(segs,x,y,size,t,o={}){
  const du=o.dur??.55,out=o.out;const ws=[];
  segs.forEach(([s,f,c])=>s.split(' ').forEach(w=>w&&ws.push({w,f,c})));
  ctx.letterSpacing=(o.ls??-size*.025)+'px';ws.forEach(w=>{ctx.font=w.f;w.wd=ctx.measureText(w.w).width});
  const sp=size*.24,tot=ws.reduce((a,b)=>a+b.wd,0)+sp*(ws.length-1);
  let cx=o.align==='center'?x-tot/2:o.align==='right'?x-tot:x;
  ctx.save();ctx.beginPath();ctx.rect(-50,y-size*1.12,W+100,size*1.5);ctx.clip();
  ws.forEach((w,i)=>{const ti=o.times?o.times[Math.min(i,o.times.length-1)]:(o.t0??0)+i*(o.st??.06);
    const k=eX(P(t,ti,ti+du));let dy=(1-k)*size*1.2;
    if(out!=null)dy-=eI(P(t,out+i*.03,out+i*.03+.34))*size*1.4;
    if(k>0&&dy>-size*1.4){ctx.fillStyle=typeof w.c==='function'?w.c(cx,y-size*.8,w.wd,size):w.c;
      if(w.f.includes('RI')){const rs=eQ(P(t,ti+.1,ti+.42));const a0=ctx.globalAlpha;if(rs<1){ctx.font=w.f.replace('RI','RD');ctx.globalAlpha=a0*(1-rs);ctx.fillText(w.w,cx,y+dy)}ctx.font=w.f;ctx.globalAlpha=a0*rs;ctx.fillText(w.w,cx,y+dy);ctx.globalAlpha=a0}
      else{ctx.font=w.f;ctx.fillText(w.w,cx,y+dy)}}
    cx+=w.wd+sp});
  ctx.restore();ctx.letterSpacing='0px';return tot;
}
const gradText=(c1,c2)=>(x,y,w,h)=>{const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,c1);g.addColorStop(1,c2);return g};
function mono(txt,x,y,t,t0,o={}){if(t<t0)return 0;ctx.save();ctx.font=o.font??F.m(20);ctx.letterSpacing=(o.ls??0)+'px';ctx.fillStyle=o.color??C.ink;ctx.textAlign=o.align??'left';
  const n=Math.floor(cl((t-t0)*(o.cps??60),0,txt.length));const s=txt.slice(0,n);ctx.fillText(s,x,y);const w=ctx.measureText(s).width;
  if(o.caret&&(n<txt.length||Math.floor(t*2.4)%2===0)){ctx.fillStyle=o.caretCol??o.color??C.ink;ctx.fillRect(x+w+3,y-(o.size??20)*.82,(o.size??20)*.5,(o.size??20)*1.02)}ctx.restore();return w}
function pill(txt,x,y,o={}){ctx.save();ctx.font=o.font??F.s(22,500);ctx.letterSpacing=(o.ls??0)+'px';
  const h=o.h??44,ic=o.icon?h*.55:0,pad=o.pad??18,w=ctx.measureText(txt).width+pad*2+ic,x0=x-(o.center?w/2:0);
  if(o.shadow)shadow(24,8,.12);rr(x0,y-h/2,w,h,o.r??h/2);ctx.fillStyle=o.bg??C.white;ctx.fill();noShadow();
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=1.2;ctx.stroke()}
  if(o.icon)o.icon(x0+pad+ic*.35,y,ic*.7);ctx.fillStyle=o.color??C.ink;ctx.textBaseline='middle';ctx.fillText(txt,x0+pad+ic,y+1);ctx.restore();return w}
function dot(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=c;ctx.fill()}
function check(x,y,s,c,k=1){if(k<=0)return;ctx.save();ctx.strokeStyle=c;ctx.lineWidth=s*.16;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  const p=[[x-s*.32,y+s*.02],[x-s*.08,y+s*.25],[x+s*.34,y-s*.24]];const l1=.35;ctx.moveTo(...p[0]);
  if(k<l1){ctx.lineTo(L(p[0][0],p[1][0],k/l1),L(p[0][1],p[1][1],k/l1))}else{ctx.lineTo(...p[1]);const kk=(k-l1)/(1-l1);ctx.lineTo(L(p[1][0],p[2][0],kk),L(p[1][1],p[2][1],kk))}ctx.stroke();ctx.restore()}
function cursor(x,y,s=1,press=0){ctx.save();ctx.translate(x,y);ctx.scale(s*(1-press*.12),s*(1-press*.12));shadow(10,4,.25);ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(0,30);ctx.lineTo(7.5,23);ctx.lineTo(12.5,34);ctx.lineTo(17,32);ctx.lineTo(12,21.5);ctx.lineTo(22,21.5);ctx.closePath();ctx.fillStyle=C.ink;ctx.fill();noShadow();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
function clickRing(x,y,t,t0){const k=P(t,t0,t0+.45);if(k<=0||k>=1)return;ctx.save();ctx.globalAlpha=1-k;ctx.strokeStyle=C.orange;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,8+eO(k)*34,0,7);ctx.stroke();ctx.restore()}
const ST={run:['Running',C.orange],ci:['CI Running',C.cyan],ok:['Success',C.green],merged:['Merged',C.purple],chg:['Changes requested',C.amber]};
function status(key,x,y,o={}){const [t,c]=ST[key];ctx.save();ctx.font=F.s(o.size??18,500);const w=ctx.measureText(t).width+34,h=(o.size??18)*1.7;rr(x,y-h/2,w,h,h/2);
  ctx.fillStyle=o.dark?'rgba(255,255,255,.08)':'#fff';ctx.fill();ctx.strokeStyle=o.dark?'rgba(255,255,255,.12)':C.line;ctx.lineWidth=1;ctx.stroke();dot(x+14,y,4.5,c);ctx.fillStyle=o.dark?'#ddd':C.ink2;ctx.textBaseline='middle';ctx.fillText(t,x+26,y+1);ctx.restore();return w}

// ---------- isometric ----------
const IC=Math.cos(Math.PI/6),IS=.5;
function iso(ox,oy,s,x,y,z){return [ox+(x-y)*IC*s,oy+(x+y)*IS*s-z*s]}
function poly(pts,fill,stroke,lw=1){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function box(ox,oy,s,x,y,z,w,d,h,top,left,right,stroke,lw=1){const p=(a,b,c)=>iso(ox,oy,s,a,b,c);
  poly([p(x,y+d,z),p(x+w,y+d,z),p(x+w,y+d,z+h),p(x,y+d,z+h)],left,stroke,lw);
  poly([p(x+w,y,z),p(x+w,y+d,z),p(x+w,y+d,z+h),p(x+w,y,z+h)],right,stroke,lw);
  poly([p(x,y,z+h),p(x+w,y,z+h),p(x+w,y+d,z+h),p(x,y+d,z+h)],top,stroke,lw)}

// ======================= SCENES =======================
const TERM=[['$ claude',.55,'#e8e8e8'],['› Refactor the auth middleware and fix failing tests',.8,'#ffffff'],['● Reading 14 files',1.45,'#9a9a9a'],['● Editing src/middleware/auth.ts',1.75,'#9a9a9a'],['● Running test suite',2.05,'#9a9a9a']];
function S0(T){ // LOCAL — cold open
  ctx.fillStyle=C.dark;ctx.fillRect(0,0,W,H);
  const iris=eIO(P(T,.38,1.0))*1300;
  // opening red dot + orbit ring
  const dk=eB(P(T,.02,.3))*(1-P(T,.55,.8));if(dk>0){ctx.save();ctx.translate(960,540);dot(0,0,14*dk,C.orange);ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,64*eO(P(T,.05,.45)),0,7);ctx.stroke();ctx.restore()}
  if(iris<=0)return;
  ctx.save();ctx.beginPath();ctx.arc(960,540,iris,0,7);ctx.clip();
  const off=P(T,3.0,3.55);// CRT power-off squeeze
  ctx.save();if(off>0){const sy=Math.max(.004,1-eI(P(off,0,.6))),sx=1-eI(P(off,.55,1))*.995;ctx.translate(960,540);ctx.scale(sx,sy);ctx.translate(-960,-540)}
  cover(V('night',T*0.9+.2),0,0,W,H,1.12+T*.02,.5,.5);ctx.fillStyle='rgba(8,8,10,.62)';ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(960,540,300,960,540,1150);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.7)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  // terminal glass
  const tx=980,ty=190,tw=800,th=470,ke=eO(P(T,.5,1.0)),dead=P(T,w_(0,6),w_(0,6)+.12);
  ctx.save();ctx.globalAlpha=ke;ctx.translate(0,(1-ke)*30);shadow(60,30,.5,'0,0,0');rr(tx,ty,tw,th,18);ctx.fillStyle='rgba(16,16,18,.78)';ctx.fill();noShadow();
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;ctx.stroke();
  [[0,'#ff5f57'],[1,'#febc2e'],[2,'#28c840']].forEach(([i,c])=>dot(tx+28+i*22,ty+28,6.5,dead>0?'#555':c));
  ctx.font=F.m(17);ctx.fillStyle='#8a8a8a';ctx.textAlign='center';ctx.fillText('zsh — ~/acme/api — local',tx+tw/2,ty+34);ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(tx,ty+56,tw,1);
  TERM.forEach(([s,t0,c],i)=>mono(s,tx+34,ty+108+i*44,T,t0,{font:F.m(21),color:c,cps:i===1?90:70}));
  // progress
  const pk=T<w_(0,6)?eQ(P(T,2.1,2.9))*.37+P(T,2.1,2.9)*0:.37*eQ(P(w_(0,6),2.1,2.9));const pv=Math.min(pk,.37*eQ(P(T,2.1,2.9)));
  if(T>2.1){const bx=tx+34,by=ty+108+5*44-10;ctx.fillStyle='rgba(255,255,255,.1)';rr(bx,by,520,10,5);ctx.fill();ctx.fillStyle=dead>0?C.red:'#e8e8e8';rr(bx,by,520*pv,10,5);ctx.fill();
    ctx.font=F.m(19);ctx.fillStyle=dead>0?C.red:'#bbb';ctx.fillText(Math.round(pv*100)+'%',bx+540,by+10)}
  if(dead>0){mono('✕ Session lost — host went to sleep',tx+34,ty+108+6*44,T,w_(0,6)+.02,{font:F.m(21,550),color:C.red,cps:120});
    mono('exit 129 (SIGHUP)',tx+34,ty+108+7*44-4,T,w_(0,6)+.3,{font:F.m(18),color:'#7a7a7a',cps:120})}
  else mono('',tx+34+0,ty+108+6*44,T,2.95,{caret:true,color:'#e8e8e8',size:21});
  ctx.restore();
  // man closes laptop (portrait card)
  const ck=eX(P(T,2.05,2.5));if(ck>0){const cw=420,chh=600,cx=1180,cy=330+(1-ck)*80;ctx.save();ctx.globalAlpha=cl(ck*1.5);ctx.translate(cx+cw/2,cy+chh/2);ctx.rotate(-.035*(1-ck)-.02);ctx.translate(-cw/2,-chh/2);
    shadow(70,30,.6,'0,0,0');rr(0,0,cw,chh,22);ctx.fillStyle='#222';ctx.fill();noShadow();ctx.clip();cover(V('close',(T-2.05)*1.05+.25),0,0,cw,chh,1.06,.5,.42);
    ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(0,0,cw,chh);ctx.restore();
    ctx.save();ctx.globalAlpha=cl(ck*1.5);pill('MacBook · battery 4%',cx+20,cy+chh-36,{font:F.m(16,500),bg:'rgba(10,10,10,.75)',color:'#ddd',h:36,pad:14});ctx.restore()}
  // glitch slices after death
  if(dead>0&&off<=0){const r=rng(Math.floor(T*40));for(let i=0;i<5;i++){const y=r()*H,h=4+r()*26,dx=(r()-.5)*60*(1-P(T,w_(0,6)+.1,3.0));ctx.drawImage(cv,0,y*SC,W*SC,h*SC,dx,y,W,h)}}
  // headline
  line([['Local',F.d(124,500),'#fff'],['agents',F.d(124,500),'#fff']],140,350,124,T,{times:[w_(0,0),w_(0,1)]});
  line([['die',F.i(170),C.orange]],136,520,170,T,{times:[w_(0,2)],ls:-2});
  line([['when your laptop sleeps.',F.d(54,400),'rgba(255,255,255,.82)']],144,620,54,T,{times:[w_(0,3),w_(0,4),w_(0,5),w_(0,6)]});
  ctx.restore();
  if(off>0){const k=P(off,.55,1);ctx.fillStyle=`rgba(255,255,255,${(1-k)*.9*P(off,.3,.6)})`;ctx.fillRect(0,540-2,W,4)}
  ctx.restore();
  // collapse to red dot
  const rd=P(T,3.35,3.62);if(rd>0){dot(960,540,6+eO(rd)*8,`rgba(255,54,22,${eO(rd)})`)}
}

const HASH=['11777ad','3fa91c2','e04b7d9','9c1d2b8','5be20f4'];
function hashReel(T,x,y,size){const times=[w_(1,2),w_(1,3)+.2,w_(1,4)+.15,w_(1,6)];let idx=0;times.forEach(t=>{if(T>=t)idx++});
  const k=idx>0?eO(P(T,times[idx-1],times[idx-1]+.42)):1;const nw=HASH[idx],od=HASH[Math.max(0,idx-1)];
  ctx.save();ctx.font=F.bb(size);const g=ctx.createLinearGradient(0,y-size*.75,0,y);g.addColorStop(0,'rgba(36,36,36,.92)');g.addColorStop(1,'rgba(120,120,120,.55)');
  let cx=x;for(let i=0;i<7;i++){const cw=size*.47;const kk=idx>0&&nw[i]!==od[i]?cl(k*1.3-i*.05):1;ctx.save();ctx.beginPath();ctx.rect(cx,y-size*.78,cw,size*.86);ctx.clip();ctx.fillStyle=g;
    if(kk<1){ctx.fillText(od[i],cx,y-kk*size*.86);ctx.fillText(nw[i],cx,y+(1-kk)*size*.86)}else ctx.fillText(nw[i],cx,y);ctx.restore();cx+=cw}ctx.restore()}
const FEED=[['agent-03','PR #482 opened','fix: retry flaky webhook','run','03:12'],['agent-07','CI passed','214 tests · 41s','ci','03:14'],['agent-11','Merged','chore: bump dependencies','merged','03:15'],
  ['agent-05','PR #483 opened','feat: SSO login flow','run','03:19'],['agent-02','Preview verified','pr-481 · recording attached','ok','03:21'],['agent-09','Merged','fix: cart total rounding','merged','03:24']];
function S1(T){ // CLOUD
  const lt=T-3.62;ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  cover(V('clouds',lt*1.2+.3),0,0,W,H,1.18-lt*.012,.5,.62-lt*.012);
  const g=ctx.createLinearGradient(0,0,W*.62,0);g.addColorStop(0,'rgba(244,244,244,.92)');g.addColorStop(1,'rgba(244,244,244,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const g2=ctx.createLinearGradient(0,0,0,H);g2.addColorStop(0,'rgba(244,244,244,.35)');g2.addColorStop(.5,'rgba(244,244,244,0)');ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
  hashReel(T,-40-lt*28,1210,880);
  line([['Hoplite',F.d(116,500),C.ink],['agents',F.d(116,500),C.ink]],140,300,116,T,{times:[w_(1,0),w_(1,1)]});
  line([['keep',F.d(116,500),C.ink],['shipping,',F.i(150),gradText(C.ink,C.orange)]],140,440,116,T,{times:[w_(1,2),w_(1,3)]});
  line([['from the cloud.',F.d(60,400),C.ink2]],146,540,60,T,{times:[w_(1,4),w_(1,5),w_(1,6)]});
  // activity feed card
  const fx=1170,fy=170,fw=610,fh=600,ke=eX(P(T,3.9,4.5));
  const grow=eIO(P(T,6.85,7.3));
  if(ke>0){const x=L(fx,0,grow),y=L(fy+(1-ke)*60,0,grow),w=L(fw,W,grow),h=L(fh,H,grow),r=L(22,0,grow);
    ctx.save();ctx.globalAlpha=cl(ke*1.4);shadow(70,28,.16*(1-grow));rr(x,y,w,h,r);ctx.fillStyle=grow>0?`rgb(${L(255,244,grow)},${L(255,244,grow)},${L(255,244,grow)})`:'rgba(255,255,255,.94)';ctx.fill();noShadow();ctx.clip();
    ctx.globalAlpha=cl(ke*1.4)*(1-P(grow,0,.35));
    const ax=x+28,ay=y+44;rr(ax,ay-20,40,40,10);ctx.fillStyle=C.orange;ctx.fill();horse(ax+5,ay-15,30,C.ink);
    ctx.font=F.s(22,600);ctx.fillStyle=C.ink;ctx.fillText('Activity',ax+54,ay+8);
    let px=x+w-28;['12 agents running'].forEach(s=>{});
    ctx.save();ctx.font=F.m(15,500);const lab='LAPTOP · CLOSED';const lw=ctx.measureText(lab).width+40;rr(x+w-28-lw,ay-17,lw,34,17);ctx.fillStyle=C.bg;ctx.fill();
    ctx.fillStyle=C.grey;ctx.beginPath();ctx.arc(x+w-28-lw+18,ay,6,0,7);ctx.fill();ctx.fillStyle=C.bg;ctx.beginPath();ctx.arc(x+w-28-lw+21,ay-3,5.4,0,7);ctx.fill();ctx.fillStyle=C.grey;ctx.textBaseline='middle';ctx.fillText(lab,x+w-28-lw+30,ay+1);ctx.restore();
    ctx.fillStyle=C.line;ctx.fillRect(x,y+88,w,1);
    const pulse=.5+.5*Math.sin(T*7);ctx.save();ctx.font=F.s(19,500);dot(ax+8,y+122,5,C.orange);ctx.globalAlpha*=.35*pulse;dot(ax+8,y+122,11,C.orange);ctx.restore();
    ctx.font=F.s(19,500);ctx.fillStyle=C.ink2;ctx.fillText('12 agents running · 0 need you',ax+24,y+129);
    // rows push in
