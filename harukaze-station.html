<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#cfe8f7" />
<title>春風駅 · Harukaze Station — a spring diorama</title>
<style>
  :root {
    --ink: #2b2433;
    --ink-soft: #4a4258;
    --glass: rgba(255, 255, 255, 0.34);
    --glass-border: rgba(255, 255, 255, 0.62);
    --btn: rgba(255, 255, 255, 0.42);
    --btn-hover: rgba(255, 255, 255, 0.68);
    --accent: #e8578f;
    --accent-soft: rgba(232, 87, 143, 0.16);
    --focus: #1f6fd1;
  }
  body.night {
    --ink: #eef0ff;
    --ink-soft: #c9cdea;
    --glass: rgba(18, 22, 52, 0.42);
    --glass-border: rgba(170, 180, 255, 0.28);
    --btn: rgba(255, 255, 255, 0.10);
    --btn-hover: rgba(255, 255, 255, 0.22);
    --accent: #ffb2cf;
    --accent-soft: rgba(255, 178, 207, 0.18);
    --focus: #9cc7ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
    color: var(--ink);
    background: #cfe8f7;
    -webkit-tap-highlight-color: transparent;
    transition: color .8s ease;
  }
  .sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #sky-day { background: linear-gradient(180deg, #9ed2f0 0%, #c7e6f6 38%, #f3e6f1 74%, #ffe3ea 100%); }
  #sky-night { opacity: 0; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

  .hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;
    padding: 16px max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .title-card { max-width: min(440px, 100%); text-shadow: 0 1px 10px rgba(255,255,255,.55); }
  body.night .title-card { text-shadow: 0 1px 12px rgba(0,0,20,.7); }
  .title-card h1 { margin: 0; font-size: clamp(20px, 2.4vw, 28px); font-weight: 700; letter-spacing: .02em; line-height: 1.15; }
  .title-card h1 .ja { letter-spacing: .12em; margin-right: .35em; }
  .title-card h1 .en { font-weight: 500; font-size: .72em; color: var(--ink-soft); }
  .title-card p { margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--ink-soft); max-width: 36ch; }

  .toolbar {
    display: flex; gap: 6px; padding: 6px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 6px 24px rgba(40, 30, 70, .12);
    transition: background .8s ease, border-color .8s ease;
  }
  .toolbar button {
    appearance: none; border: 1px solid transparent; cursor: pointer;
    min-height: 44px; min-width: 44px; padding: 0 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font: 600 13.5px/1 inherit; font-family: inherit; color: var(--ink);
    background: var(--btn); border-radius: 13px;
    transition: background .2s ease, color .2s ease, border-color .2s ease, opacity .2s ease;
    white-space: nowrap;
  }
  .toolbar button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .toolbar button:hover { background: var(--btn-hover); }
  .toolbar button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .toolbar button[aria-pressed="true"] svg { stroke: var(--accent); }
  .toolbar button[aria-disabled="true"] { cursor: default; opacity: .62; background: transparent; border-color: var(--glass-border); }
  .toolbar button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; display: none; }
  #btn-train[aria-disabled="true"] .dot { display: inline-block; animation: pulse 1.1s ease-in-out infinite; }
  #btn-train[aria-disabled="true"] svg { display: none; }
  @keyframes pulse { 50% { opacity: .25; } }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
    color: #3b3350; transition: opacity .6s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay .card { background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.7); border-radius: 18px; padding: 22px 26px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 420px; }
  .overlay h2 { margin: 0 0 6px; font-size: 18px; }
  .overlay p { margin: 0; font-size: 14px; line-height: 1.5; }
  .spinner { width: 34px; height: 34px; margin: 0 auto 12px; border-radius: 50%; border: 3px solid rgba(232,87,143,.25); border-top-color: #e8578f; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error { display: none; }
  #error.show { display: grid; }

  @media (max-width: 640px) {
    .hud { flex-direction: column; align-items: stretch; gap: 10px; padding-top: 10px; }
    .title-card h1 { font-size: 20px; }
    .title-card p { font-size: 12.5px; margin-top: 3px; max-width: none; }
    .toolbar { width: 100%; }
    .toolbar button { flex: 1 1 0; padding: 0 8px; min-height: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="sky-day" class="sky" aria-hidden="true"></div>
<canvas id="sky-night" class="sky" aria-hidden="true"></canvas>
<div id="stage" role="img" aria-label="Low-poly 3D diorama of Harukaze, a rural Japanese railway station in spring, with a two-car train, a level crossing, cherry trees and a small village. Drag to rotate, scroll or pinch to zoom."></div>

<div class="hud">
  <div class="title-card">
    <h1><span class="ja" lang="ja">春風駅</span><span class="en">Harukaze Station</span></h1>
    <p>Petals drift over a sleepy country line, where the two-car local pauses on its way through the hills.</p>
  </div>
  <div class="toolbar" role="toolbar" aria-label="Diorama controls">
    <button id="btn-mode" type="button" aria-pressed="false" title="Toggle day and night (N)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g class="ico-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g><path class="ico-moon" d="M19.5 14.6A8 8 0 1 1 9.4 4.5a6.4 6.4 0 0 0 10.1 10.1z" style="display:none"/></svg>
      <span class="lbl">Day</span>
    </button>
    <button id="btn-orbit" type="button" aria-pressed="true" title="Toggle slow camera orbit (O)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9.5" ry="4.2"/><circle cx="12" cy="12" r="2.2"/><path d="M18.6 6.6l2.2.4-.7 2.1"/></svg>
      <span class="lbl">Orbit On</span>
    </button>
    <button id="btn-train" type="button" title="Call the next train (T)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="13" rx="3"/><path d="M5 10.5h14M9 20.5l-2 1.5M15 20.5l2 1.5M8.5 14h.01M15.5 14h.01"/></svg>
      <span class="dot" aria-hidden="true"></span>
      <span class="lbl">Train</span>
    </button>
  </div>
</div>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>

<div id="loading" class="overlay" role="status" aria-live="polite">
  <div class="card"><div class="spinner" aria-hidden="true"></div><p>Building the diorama…</p></div>
</div>
<div id="error" class="overlay" role="alert">
  <div class="card"><h2>The diorama couldn’t start</h2><p id="error-msg">Something went wrong.</p></div>
</div>

<script type="module">
/* ==========================================================================
   Boot: load pinned dependencies with a visible failure path
   ========================================================================== */
const $ = (id) => document.getElementById(id);
function showError(msg) {
  $('loading').classList.add('hidden');
  $('error-msg').textContent = msg;
  $('error').classList.add('show');
}
function hasWebGL2() {
  try { const c = document.createElement('canvas'); return !!c.getContext('webgl2'); } catch (e) { return false; }
}

let THREE, OrbitControls, OutlineEffect, BGU;
try {
  [THREE, { OrbitControls }, { OutlineEffect }, BGU] = await Promise.all([
    import('three'),
    import('three/addons/controls/OrbitControls.js'),
    import('three/addons/effects/OutlineEffect.js'),
    import('three/addons/utils/BufferGeometryUtils.js'),
  ]);
} catch (err) {
  console.error(err);
  showError('The 3D library (Three.js) could not be downloaded. Check your internet connection or content blockers, then reload the page.');
  throw err;
}
if (!hasWebGL2()) {
  showError('Your browser or device does not support WebGL 2, which this 3D scene needs. Try a recent version of Chrome, Edge, Firefox or Safari, or enable hardware acceleration.');
  throw new Error('WebGL2 unavailable');
}

try {
  main();
} catch (err) {
  console.error(err);
  showError('WebGL could not be initialised on this device (' + (err && err.message ? err.message : 'unknown error') + '). Try enabling hardware acceleration or using another browser.');
}

function main() {
/* ==========================================================================
   Constants, deterministic randomness, small math helpers
   ========================================================================== */
const TZ = 1.0;                 // track centre line (z)
const RAIL_TOP = 0.5;
const PLAT = { x0: -10.5, x1: 5.5, z0: -3.7, z1: -0.15, h: 0.95 };
const ROAD = { x: 8.5, w: 3.2 };
ROAD.x0 = ROAD.x - ROAD.w / 2; ROAD.x1 = ROAD.x + ROAD.w / 2;
const PORTAL_X = 12.8;          // tunnel mouth face
const CLIP_X = 12.95;           // train clipping planes, just inside the mouth
const TRAIN_LEN = 14.4;

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0x5A4B12);
const R = (a = 0, b = 1) => a + (b - a) * rng();
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function hash2(x, z) { const h = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return h - Math.floor(h); }
function hash3(x, y, z) { const h = Math.sin(x * 127.1 + y * 269.5 + z * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

/* ==========================================================================
   Renderer, scene, camera
   ========================================================================== */
const reducedMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
let reducedMotion = reducedMQ.matches;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
$('stage').appendChild(renderer.domElement);
renderer.domElement.setAttribute('tabindex', '-1');

const effect = new OutlineEffect(renderer, { defaultThickness: 0.0032, defaultColor: [0.10, 0.07, 0.13], defaultAlpha: 0.95 });

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.5, 400);
const glowObjects = []; // Points / Sprites, hidden during the outline pass

/* ==========================================================================
   Canvas textures (all procedural)
   ========================================================================== */
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const JP_FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Meiryo","Noto Sans JP","Noto Sans CJK JP","Source Han Sans JP",sans-serif';
const EN_FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
function canvasTex(canvas, { repeat = false, srgb = true } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Positions of cherry trees are needed by the grass painter (fallen petals).
const CHERRY_TREES = [
  { x: -9.4, z: 7.4, s: 1.15 }, { x: -3.6, z: 10.6, s: 1.0 }, { x: 11.7, z: 7.8, s: 0.92 },
  { x: -11.6, z: -5.9, s: 1.05 }, { x: 4.4, z: -7.6, s: 1.1 },
];
const GRASS = { x0: -13.3, x1: 13.3, z0: -14, z1: 14 };

function paintGrass() {
  const W = 1536, H = Math.round(1536 * (GRASS.z1 - GRASS.z0) / (GRASS.x1 - GRASS.x0));
  const c = makeCanvas(W, H), g = c.getContext('2d');
  const r = mulberry32(77);
  const toC = (x, z) => [(x - GRASS.x0) / (GRASS.x1 - GRASS.x0) * W, (z - GRASS.z0) / (GRASS.z1 - GRASS.z0) * H];
  const ppu = W / (GRASS.x1 - GRASS.x0);
  g.fillStyle = '#86c95c'; g.fillRect(0, 0, W, H);
  const patch = ['#7cc152', '#93d167', '#8acb5d', '#76b94d', '#9ad66f'];
  for (let i = 0; i < 700; i++) {
    const x = r() * W, y = r() * H, rad = 14 + r() * 60;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    const col = patch[Math.floor(r() * patch.length)];
    gr.addColorStop(0, col + 'aa'); gr.addColorStop(1, col + '00');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
  }
  // footpaths
  g.lineCap = 'round'; g.lineJoin = 'round';
  const path = (pts, w, col) => {
    g.strokeStyle = col; g.lineWidth = w * ppu; g.beginPath();
    pts.forEach(([x, z], i) => { const [cx, cy] = toC(x, z); i ? g.lineTo(cx, cy) : g.moveTo(cx, cy); });
    g.stroke();
  };
  const dirt = [[-6.6, -8.4], [-7.1, -10.5], [-8.0, -12.2], [-8.3, -14.2]];
  path(dirt, 1.25, '#c9b48a'); path(dirt, 0.9, '#d8c49b');
  const dirt2 = [[-7.1, -10.5], [-9.4, -10.2]]; path(dirt2, 0.8, '#c9b48a');
  const dirt3 = [[-6.9, -9.8], [-4.2, -10.0], [-1.8, -9.6], [0.6, -9.0]]; path(dirt3, 0.75, '#ccb88f');
  const dirt4 = [[6.7, -2.0], [6.7, -1.0]]; path(dirt4, 1.2, '#cdbb92');
  // grass blades, batched per colour
  const blades = ['#5f9f3f', '#6fb34a', '#a6dc7a', '#b8e68c', '#4f8f36'];
  for (const col of blades) {
    g.strokeStyle = col; g.lineWidth = 1.6; g.beginPath();
    for (let i = 0; i < 3200; i++) {
      const x = r() * W, y = r() * H, a = -Math.PI / 2 + (r() - 0.5) * 1.6, l = 3 + r() * 6;
      g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l);
    }
    g.stroke();
  }
  // clover flowers
  for (const [col, n] of [['#fffdf2', 420], ['#ffe27a', 160], ['#d9b7ff', 90]]) {
    g.fillStyle = col; g.beginPath();
    for (let i = 0; i < n; i++) { const x = r() * W, y = r() * H; g.moveTo(x + 2.6, y); g.arc(x, y, 2.6, 0, Math.PI * 2); }
    g.fill();
  }
  // fallen sakura petals: dense rings under each tree plus a light scatter
  const petalCols = ['#ffd3e3', '#f9b2cd', '#ffe8f0', '#f49cbf'];
  const drawPetal = (x, y, s) => { g.moveTo(x + s, y); g.ellipse(x, y, s, s * 0.62, r() * Math.PI, 0, Math.PI * 2); };
  for (const col of petalCols) {
    g.fillStyle = col; g.beginPath();
    for (const t of CHERRY_TREES) {
      const [cx, cy] = toC(t.x, t.z);
      for (let i = 0; i < 520; i++) {
        const a = r() * Math.PI * 2, d = Math.pow(r(), 0.7) * 3.1 * t.s * ppu;
        drawPetal(cx + Math.cos(a) * d * 1.1, cy + Math.sin(a) * d, 2.4 + r() * 2.4);
      }
    }
    for (let i = 0; i < 260; i++) drawPetal(r() * W, r() * H, 2.2 + r() * 2);
    g.fill();
  }
  return canvasTex(c);
}

function paintRoad() {
  const L = 28, W = 256, H = 2240, ppu = W / ROAD.w;
  const c = makeCanvas(W, H), g = c.getContext('2d');
  const r = mulberry32(31);
  const zy = (z) => (z + 14) / L * H;  // canvas top = -z
  g.fillStyle = '#6b6d76'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 9000; i++) { g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.07)'; g.fillRect(r() * W, r() * H, 2, 2); }
  // crossing deck panels
  const d0 = zy(TZ - 1.45), d1 = zy(TZ + 1.45);
  g.fillStyle = '#9b9da5'; g.fillRect(0, d0, W, d1 - d0);
  g.strokeStyle = '#7f828a'; g.lineWidth = 3;
  for (let x = 0; x <= W; x += W / 4) { g.beginPath(); g.moveTo(x, d0); g.lineTo(x, d1); g.stroke(); }
  for (const rz of [TZ - 0.55, TZ + 0.55]) { g.fillStyle = '#3a3b40'; g.fillRect(0, zy(rz) - 7, W, 14); }
  // edge lines
  g.fillStyle = '#f4f4ef';
  for (const ex of [0.14, ROAD.w - 0.14]) {
    const x = ex * ppu;
    g.fillRect(x - 4, 0, 8, d0 - 30); g.fillRect(x - 4, d1 + 30, 8, H - d1 - 30);
  }
  // dashed centre line, solid near the crossing
  for (let z = -14; z < 14; z += 1.6) {
    if (Math.abs(z - TZ) < 9) continue;
    g.fillRect(W / 2 - 3, zy(z), 6, 0.8 * ppu);
  }
  g.fillRect(W / 2 - 3, zy(TZ - 9), 6, zy(TZ - 2) - zy(TZ - 9));
  g.fillRect(W / 2 - 3, zy(TZ + 2), 6, zy(TZ + 9) - zy(TZ + 2));
  // stop lines (left-hand traffic): southbound lane x<centre stops at z=+4.4, northbound at z=-2.4
  g.fillRect(8, zy(4.4) - 12, W / 2 - 14, 24);
  g.fillRect(W / 2 + 6, zy(-2.4) - 12, W / 2 - 14, 24);
  // 止まれ – stretched along the direction of travel, read by the approaching driver
  const stopText = (cx, cz, flip) => {
    g.save(); g.translate(cx, zy(cz)); if (flip) g.rotate(Math.PI); g.scale(1, 2.3);
    g.font = `900 ${Math.round(0.5 * ppu)}px ${JP_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#f6f6f0'; g.fillText('止まれ', 0, 0); g.restore();
  };
  stopText(W / 4 + 2, 6.6, false);
  stopText(3 * W / 4 - 2, -4.6, true);
  return canvasTex(c);
}

// Sign atlas: name board, station sign, clock face
const ATLAS = { name: [0, 0, 1024, 410], station: [0, 420, 1024, 256], clock: [0, 690, 320, 320], plate: [340, 700, 300, 150] };
function paintSigns() {
  const c = makeCanvas(1024, 1024), g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 1024, 1024);
  // --- station name board (はるかぜ / Harukaze)
  {
    const [x, y, w, h] = ATLAS.name;
    g.fillStyle = '#fbfbf7'; g.fillRect(x, y, w, h);
    g.fillStyle = '#2f9e95'; g.fillRect(x, y + 0, w, 16);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = '#22202a';
    g.font = `600 44px ${JP_FONT}`; g.fillText('春風', x + w / 2, y + 74);
    g.font = `800 132px ${JP_FONT}`; g.fillText('はるかぜ', x + w / 2, y + 206);
    g.font = `600 46px ${EN_FONT}`; g.fillStyle = '#3a3846'; g.fillText('Harukaze', x + w / 2, y + 262);
    // neighbour band

    box(B.solid, '#b7b1a6', 0, 6.12, 0.25, 8.0, 0.28, 0.95);          // coping
    box(B.solid, '#57524c', 0, 5.25, -0.03, 1.5, 0.45, 0.08);          // name plaque

    box(B.solid, '#b7b1a6', 3.65, 3.0, -0.05, 0.3, 6.0, 0.15);
  });
  // portal-side signal (small detail)
  const sx = sign * (PORTAL_X - 0.9), sz = TZ - 2.35;
  cyl(B.solid, '#55585f', sx, 1.4, sz, 0.06, 2.8);
  box(B.solid, '#2c2d33', sx, 2.75, sz, 0.32, 0.6, 0.22);

  // cedars, bushes and a cherry tree on the hill
  const spots = [[15.4, -8.2], [17.3, -5.4], [16.4, 8.6], [18.5, 10.4], [17.9, -11.0], [14.9, -11.6], [18.7, 4.2], [16.1, 5.6], [19.0, -2.4], [15.2, 10.8]];
  for (const [ax, z] of spots) {
    const x = sign * (ax + R(-0.4, 0.4)), zz = z + R(-0.5, 0.5);

  for (let i = 0; i < 9; i++) {

  }
}

function cedar(x, y, z, s) {

function bushCluster(x, y, z, s = 1) {
  const greens = ['#5aa547', '#6cb852', '#4f9a40', '#7ac45c'];
  const n = 2 + Math.floor(R(0, 3));
  for (let i = 0; i < n; i++) {

  }
  if (rng() < 0.35) {
    for (let i = 0; i < 3; i++) box(B.solid, pick(['#ffffff', '#ffd6e6', '#fff1a6']), x + R(-0.4, 0.4), y + R(0.5, 0.8) * s, z + R(-0.4, 0.4), 0.09, 0.09, 0.09);

  }
  for (const rz of [TZ - 0.55, TZ + 0.55]) {
    box(b, '#c3c8cf', 0, 0.465, rz, 39.8, 0.07, 0.085);

    rod(b, '#8d8f96', new THREE.Vector3(x, 4.15, TZ), new THREE.Vector3(x, 3.56, TZ), 0.025);
    cyl(b, '#f0ece2', x, 4.15, TZ + 1.25, 0.06, 0.22, 6, 0, 0, Math.PI / 2);
  }
  rod(b, wire, new THREE.Vector3(-19.9, 3.55, TZ), new THREE.Vector3(19.9, 3.55, TZ), 0.024, 4);
  rod(b, wire, new THREE.Vector3(-19.9, 4.12, TZ), new THREE.Vector3(19.9, 4.12, TZ), 0.022, 4);

   Station: platform, shelter, building, signs, furniture
   ========================================================================== */
function gableRoof(w, d, eaveY, rise, ov, roofCol, wallCol, trimCol) {
  // ridge along local x; slopes face ±z
  const half = d / 2 + ov, pitch = Math.atan2(rise, d / 2), slopeLen = half / Math.cos(pitch);
  const ridgeY = eaveY + rise;
  for (const s of [1, -1]) {
    const cz = s * half / 2, cy = ridgeY - (half / 2) * Math.tan(pitch);
    box(B.solid, roofCol, 0, cy + 0.07, cz, w + ov * 2, 0.16, slopeLen, s * pitch, 0, 0);
    // fascia
    box(B.solid, trimCol, 0, ridgeY - half * Math.tan(pitch) + 0.02, s * (half - 0.02), w + ov * 2, 0.16, 0.06, s * pitch, 0, 0);
  }
  box(B.solid, shade(roofCol, 0.72), 0, ridgeY + 0.13, 0, w + ov * 2 + 0.04, 0.14, 0.26);
  B.solid.add(prism([[-d / 2, 0], [d / 2, 0], [0, rise]], w), wallCol, T(-w / 2, eaveY, 0, 0, Math.PI / 2, 0));
  for (const s of [1, -1]) {
    for (const zs of [1, -1]) {
      box(B.solid, trimCol, s * (w / 2 + ov - 0.04), ridgeY - (half / 2) * Math.tan(pitch) + 0.1, zs * half / 2, 0.08, 0.14, slopeLen + 0.02, zs * pitch, 0, 0);
    }
  }
}

// window with frame + mullions; face: local +z, centred at (x,y,z)
function windowUnit(x, y, z, w, h, frameCol = '#fbfaf5', ry = 0, glow = true) {

    if (h > 0.6) box(B.solid, frameCol, 0, h * 0.12, 0.075, w, 0.04, 0.03);
    box(B.solid, shade(frameCol, 0.8), 0, -h / 2 - 0.09, 0.08, w + 0.24, 0.06, 0.14);

}

function buildPlatform() {
  const b = B.solid, { x0, x1, z0, z1, h } = PLAT, cx = (x0 + x1) / 2, len = x1 - x0;
  box(b, '#ddcfb8', cx, h / 2, (z0 + z1) / 2, len, h, z1 - z0);
  box(b, '#c6b8a1', cx, 0.33, z1 + 0.005, len, 0.38, 0.02);                       // refuge band
  for (let x = x0 + 1.6; x < x1; x += 1.6) box(b, '#bfb19a', x, h / 2, z1 + 0.012, 0.05, h - 0.06, 0.02);
  box(b, '#efe7d8', cx, h + 0.025, z1 - 0.2, len + 0.02, 0.05, 0.46);               // coping
  box(b, '#f5c42c', cx, h + 0.012, z1 - 0.72, len - 0.3, 0.025, 0.32);              // tactile strip
  for (let i = -1; i <= 1; i++) box(b, '#e5ad16', cx, h + 0.03, z1 - 0.72 + i * 0.09, len - 0.36, 0.018, 0.035);
  box(b, '#f4f2ea', cx, h + 0.012, z1 - 0.48, len - 0.1, 0.02, 0.06);              // white edge line

  b.add(prism([[0, 0], [1.1, 0], [0, h]], z1 - z0), '#d5c7af', T(x1, 0, z0));

}

function fenceRun(ax, az, bx, bz, h, col, picket = 0.3) {
  const a = new THREE.Vector3(ax, 0, az), c = new THREE.Vector3(bx, 0, bz), len = a.distanceTo(c), ang = Math.atan2(bz - az, bx - ax);
  within(T(ax, 0, az, 0, -ang, 0), () => {
    const posts = Math.max(1, Math.round(len / 1.2));
    for (let i = 0; i <= posts; i++) box(B.solid, shade(col, 0.85), i * len / posts, h / 2, 0, 0.09, h, 0.09);
    box(B.solid, col, len / 2, h * 0.85, 0, len, 0.06, 0.05);
    box(B.solid, col, len / 2, h * 0.4, 0, len, 0.06, 0.05);
    if (picket) for (let x = picket; x < len - 0.05; x += picket) box(B.solid, col, x, h * 0.48, 0, 0.035, h * 0.85, 0.03);
  });
}

function buildShelter() {
  const b = B.solid, y0 = PLAT.h;
  const xs = [-0.9, 1.5, 3.7], zf = -1.45, zb = -3.3, yf = 3.3, yb = 3.0;
  for (const x of xs) {
    box(b, '#e9e4da', x, y0 + (yf - y0) / 2, zf, 0.14, yf - y0, 0.14);
    box(b, '#e9e4da', x, y0 + (yb - y0) / 2, zb, 0.14, yb - y0, 0.14);
    rod(b, '#d6d0c4', new THREE.Vector3(x, yf - 0.02, zf), new THREE.Vector3(x, yb - 0.02, zb), 0.05, 4);
  }
  box(b, '#d9d3c7', 1.4, yf, zf, 4.9, 0.14, 0.16);
  box(b, '#d9d3c7', 1.4, yb, zb, 4.9, 0.14, 0.16);
  // corrugated roof (triangle-wave ribs running down the slope)
  const W = 5.6, D = 2.85, ribs = 28, n = ribs * 2;
  const pos = [];
  for (let i = 0; i < n; i++) {
    const xa = -W / 2 + (i / n) * W, xb = -W / 2 + ((i + 1) / n) * W;
    const ya = (i % 2) * 0.07, yb2 = ((i + 1) % 2) * 0.07;
    pos.push(xa, ya, D / 2, xb, yb2, D / 2, xb, yb2, -D / 2, xa, ya, D / 2, xb, yb2, -D / 2, xa, ya, -D / 2);
  }
  const corr = new THREE.BufferGeometry();
  corr.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  corr.computeVertexNormals();
  const pitch = -Math.atan2(0.34, D);
  const roofM = T(1.4, (yf + yb) / 2 + 0.14, (zf + zb) / 2 + 0.22, pitch, 0, 0);
  within(roofM, () => {
    B.solid.add(corr, (ny, i) => (i % 4 < 2 ? '#5cc0b2' : '#4aa99c'));
    box(B.solid, '#3f9286', 0, -0.03, 0, W, 0.05, D);
    box(B.solid, '#f2efe7', 0, 0.02, D / 2 + 0.02, W + 0.04, 0.14, 0.05);
    box(B.solid, '#f2efe7', -W / 2 - 0.02, 0.02, 0, 0.05, 0.12, D);
    box(B.solid, '#f2efe7', W / 2 + 0.02, 0.02, 0, 0.05, 0.12, D);
    // fluorescent tubes under the roof
    for (const lx of [0.3 - 1.4, 2.6 - 1.4]) {
      box(B.lamp, '#fff', lx, -0.12, 0.05, 1.0, 0.06, 0.08);
      glowPts.lamp.push(worldPt(lx, -0.25, 0.05));
    }
  });
  // back wall with a poster
  box(b, '#a8714a', 1.4, y0 + 0.62, zb - 0.05, 4.6, 1.24, 0.06);
  box(b, '#f0e6d2', 1.4, y0 + 1.6, zb - 0.05, 4.6, 0.7, 0.05);
  box(b, '#f6a6c4', 0.2, y0 + 1.6, zb - 0.01, 0.5, 0.56, 0.02);
  box(b, '#7cc4e6', 2.6, y0 + 1.6, zb - 0.01, 0.8, 0.5, 0.02);
  // benches
  for (const bx of [0.3, 2.6]) {
    box(b, '#c9884c', bx, y0 + 0.45, -2.85, 1.6, 0.07, 0.45);
    box(b, '#c9884c', bx, y0 + 0.75, -3.08, 1.6, 0.3, 0.06);
    for (const lx of [-0.65, 0.65]) box(b, '#6d7078', bx + lx, y0 + 0.22, -2.88, 0.07, 0.44, 0.4);
  }
  // hanging clock
  rod(b, '#55575e', new THREE.Vector3(1.32, yf - 0.05, zf), new THREE.Vector3(1.32, 2.98, zf), 0.018, 4);
  rod(b, '#55575e', new THREE.Vector3(1.68, yf - 0.05, zf), new THREE.Vector3(1.68, 2.98, zf), 0.018, 4);
  cyl(b, '#2f2e35', 1.5, 2.72, zf, 0.3, 0.12, 12, Math.PI / 2, 0, 0);
  B.sign.add(atlasPlane(0.5, 0.5, [ATLAS.clock[0] + 8, ATLAS.clock[1] + 8, 304, 304]), '#fff', T(1.5, 2.72, zf + 0.065));
  B.sign.add(atlasPlane(0.5, 0.5, [ATLAS.clock[0] + 8, ATLAS.clock[1] + 8, 304, 304]), '#fff', T(1.5, 2.72, zf - 0.065, 0, Math.PI, 0));
  // platform number plate hanging from the roof
  box(b, '#26324a', -0.3, 2.95, zf, 0.82, 0.42, 0.04);
  B.sign.add(atlasPlane(0.78, 0.39, ATLAS.plate), '#fff', T(-0.3, 2.95, zf + 0.025));
  B.sign.add(atlasPlane(0.78, 0.39, ATLAS.plate), '#fff', T(-0.3, 2.95, zf - 0.025, 0, Math.PI, 0));
  rod(b, '#55575e', new THREE.Vector3(-0.3, yf - 0.05, zf), new THREE.Vector3(-0.3, 3.16, zf), 0.018, 4);
}

function roadY(z) { const d = Math.abs(z - TZ); return 0.035 + (ROAD_TOP - 0.035) * smooth(3.0, 1.4, d); }
function buildRoad() {
  const g = new THREE.PlaneGeometry(ROAD.w, 28, 1, 112).rotateX(-Math.PI / 2).translate(ROAD.x, 0, 0);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, roadY(p.getZ(i)));
  g.computeVertexNormals();
  const road = new THREE.Mesh(g, MAT.road);
  road.receiveShadow = true; road.matrixAutoUpdate = false;
  // kerbs/skirts down to the ground on both sides
  const pos = [];

      const za = -14 + i * 0.25, zb = za + 0.25;

  const sk = new THREE.BufferGeometry(); sk.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); sk.computeVertexNormals();

}

function buildUtilityPoles() {
  const P = [[ROAD.x0 - 0.75, 12.7], [ROAD.x0 - 0.75, 5.6], [ROAD.x0 - 0.75, -4.9], [ROAD.x0 - 0.75, -12.4], [-1.4, -13.4], [-8.7, -13.3], [-12.6, -9.0]];
  const tops = [];
  P.forEach(([x, z], i) => {
    const prev = P[i - 1] || P[i], next = P[i + 1] || P[i];
    const dir = new THREE.Vector2(next[0] - prev[0], next[1] - prev[1]).normalize();
    const ang = Math.atan2(dir.y, dir.x);       // along the line
    const h = 5.2;
    cyl(B.solid, '#a9a6a0', x, h / 2, z, 0.1, h, 8);
    within(T(x, 0, z, 0, -ang + Math.PI / 2, 0), () => {
      box(B.solid, '#6e6a64', 0, h - 0.25, 0, 1.3, 0.08, 0.1);
      const pts = [];
      for (const ox of [-0.55, 0, 0.55]) {
        cyl(B.solid, '#f2efe6', ox, h - 0.13, 0, 0.04, 0.16, 6);
        pts.push(worldPt(ox, h - 0.06, 0));
      }
      tops.push(pts);
      if (i === 2) { cyl(B.solid, '#8c9097', 0.0, h - 1.1, 0.22, 0.22, 0.6, 8); }
      for (let k = 0; k < 6; k++) box(B.solid, '#6e6a64', 0, 1.6 + k * 0.45, k % 2 ? 0.12 : -0.12, 0.04, 0.04, 0.2);
    });
  });
  // sagging wires between neighbouring poles
  for (let i = 0; i < tops.length - 1; i++) {
    const A = tops[i], Bp = tops[i + 1];
    for (let k = 0; k < 3; k++) {
      const a = A[k], c = Bp[k], pts = [];
      const sag = 0.28 + a.distanceTo(c) * 0.025;
      for (let t = 0; t <= 10; t++) {
        const u = t / 10, p = a.clone().lerp(c, u);
        p.y -= sag * 4 * u * (1 - u);
        pts.push(p);
      }
      const tube = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 14, 0.018, 3, false);
      B.solid.add(tube, '#2f2d34');
    }
  }
}

function buildGrassTufts() {
  const blade = new THREE.ConeGeometry(0.05, 0.42, 3).translate(0, 0.21, 0);

    const g = blade.clone().rotateZ((i - 1.5) * 0.28).rotateY(i * 1.7).translate((i - 1.5) * 0.05, 0, (i % 2) * 0.05);
    parts.push(g.toNonIndexed());

  const geo = BGU.mergeGeometries(parts); geo.computeVertexNormals();
  const N = 340, mesh = new THREE.InstancedMesh(geo, MAT.tuft, N);

}

/* ==========================================================================

   ========================================================================== */
const S0 = -CLIP_X - 0.6;                     // front just inside west tunnel (fully hidden)
const S_STOP = (PLAT.x0 + PLAT.x1) / 2 + TRAIN_LEN / 2;   // both cars centred on the platform
const S_END = CLIP_X + TRAIN_LEN + 0.6;       // rear just inside east tunnel (fully hidden)
const TL = {
  barDown: 0.6, barMove: 3.0,                 // lamps start at 0, arms fully down at 3.6
  arrive: 4.0, arriveDur: 9.5,                // emerges after the arms are down
  dwell: 5.0, departDur: 8.0,
  loop: 32.0,

TL.stop = TL.arrive + TL.arriveDur;
TL.depart = TL.stop + TL.dwell;
TL.gone = TL.depart + TL.departDur;

const departH = (u) => u * u * (1.5 - 0.5 * u);

  if (t <= TL.gone) return S_STOP + (S_END - S_STOP) * departH((t - TL.depart) / TL.departDur);

})();

  const mx = w * 0.82, my = h * 0.16, mr = Math.max(18, Math.min(w, h) * 0.035);
  const halo = g.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 4);
  halo.addColorStop(0, 'rgba(255,244,214,0.28)'); halo.addColorStop(1, 'rgba(255,244,214,0)');
  g.fillStyle = halo; g.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
  g.fillStyle = '#fff4d6'; g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(214,200,170,0.35)'; g.beginPath(); g.arc(mx - mr * 0.3, my + mr * 0.2, mr * 0.22, 0, Math.PI * 2); g.arc(mx + mr * 0.35, my - mr * 0.3, mr * 0.15, 0, Math.PI * 2); g.fill();
}

/* ==========================================================================
   Camera, controls, framing
   ========================================================================== */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minPolarAngle = 0.32; controls.maxPolarAngle = 1.2;
controls.rotateSpeed = 0.7; controls.zoomSpeed = 0.8;
controls.target.set(0.4, 0.6, -0.4);
let fitDist = 0;
function computeFit() {
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2), tanV = Math.tan(vHalf), tanH = tanV * camera.aspect;
  return Math.max(24.5 / tanH, 15.5 / tanV) * 0.95;
}
function setCameraSpherical(dist, polar, az) {
  const t = controls.target;
  camera.position.set(t.x + dist * Math.sin(polar) * Math.sin(az), t.y + dist * Math.cos(polar), t.z + dist * Math.sin(polar) * Math.cos(az));
  camera.lookAt(t);
}
const hudEl = document.querySelector('.hud');
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
  const narrow = w <= 640 || w / h < 0.85;
  const reserve = narrow ? Math.min(hudEl.getBoundingClientRect().height, h * 0.35) : 0;
  const fullH = h + reserve;
  camera.aspect = w / fullH;
  camera.fov = camera.aspect < 1 ? 46 : 34;
  camera.setViewOffset(w, fullH, 0, reserve, w, h);
  camera.updateProjectionMatrix();
  const newFit = computeFit();
  const cur = camera.position.distanceTo(controls.target);
  if (fitDist === 0) setCameraSpherical(newFit, 1.0, 0.5);
  else { const dir = camera.position.clone().sub(controls.target).normalize(); camera.position.copy(controls.target).addScaledVector(dir, cur * newFit / fitDist); }
  fitDist = newFit;
  controls.minDistance = newFit * 0.5;
  controls.maxDistance = newFit * 1.45;
  drawNightSky();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
onResize();

// gentle sway orbit around the current view; paused while the user interacts
let orbitEnabled = !reducedMotion, autoTrain = !reducedMotion;
let interacting = false, lastInteract = -1e9, orbitPhase = 0;
controls.addEventListener('start', () => { interacting = true; });
controls.addEventListener('end', () => { interacting = false; lastInteract = performance.now(); });
const _off = new THREE.Vector3();
function updateCamera(dt) {
  const idle = !interacting && performance.now() - lastInteract > 3500;
  if (orbitEnabled && idle && !reducedMotion) {
    orbitPhase += dt;
    const w = (Math.PI * 2) / 70, A = 0.5;
    const dAz = A * w * Math.cos(w * orbitPhase) * dt + 0.0025 * dt;
    _off.subVectors(camera.position, controls.target).applyAxisAngle(UP, dAz);
    camera.position.copy(controls.target).add(_off);
  }
  controls.update();
}

/* ==========================================================================
   Interface
   ========================================================================== */
const btnMode = $('btn-mode'), btnOrbit = $('btn-orbit'), btnTrain = $('btn-train'), statusEl = $('status');
let lastAnnounce = '';
function announce(msg) { if (msg !== lastAnnounce) { lastAnnounce = msg; statusEl.textContent = msg; } }
function updateModeButton() {
  btnMode.setAttribute('aria-pressed', String(night));
  btnMode.querySelector('.lbl').textContent = night ? 'Night' : 'Day';
  btnMode.setAttribute('aria-label', night ? 'Night mode on. Switch to day' : 'Day mode. Switch to night');
  btnMode.querySelector('.ico-sun').style.display = night ? 'none' : '';
  btnMode.querySelector('.ico-moon').style.display = night ? '' : 'none';
  document.body.classList.toggle('night', night);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', night ? '#141c40' : '#cfe8f7');
}
function updateOrbitButton() {
  btnOrbit.setAttribute('aria-pressed', String(orbitEnabled));
  btnOrbit.querySelector('.lbl').textContent = orbitEnabled ? 'Orbit On' : 'Orbit Off';
}
function updateTrainButton() {
  const busy = journey.active;
  btnTrain.setAttribute('aria-disabled', String(busy));
  btnTrain.querySelector('.lbl').textContent = busy ? 'En route' : 'Train';
  btnTrain.setAttribute('aria-label', busy ? 'Train en route, please wait' : 'Call the next train');
}
function toggleNight() { night = !night; updateModeButton(); announce(night ? 'Night mode' : 'Day mode'); }
function toggleOrbit() { orbitEnabled = !orbitEnabled; lastInteract = -1e9; updateOrbitButton(); announce(orbitEnabled ? 'Camera orbit on' : 'Camera orbit off'); }
function callTrain() { if (journey.active) { announce('A train is already on its way.'); return; } startJourney(); }
btnMode.addEventListener('click', toggleNight);
btnOrbit.addEventListener('click', toggleOrbit);
btnTrain.addEventListener('click', callTrain);
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'n') toggleNight(); else if (k === 'o') toggleOrbit(); else if (k === 't') callTrain();
});
function applyMotionPreference() {
  reducedMotion = reducedMQ.matches;
  orbitEnabled = !reducedMotion; autoTrain = !reducedMotion;
  if (!reducedMotion && !journey.active) journey.nextAuto = simClock + 2;
  updateOrbitButton();
}
reducedMQ.addEventListener ? reducedMQ.addEventListener('change', applyMotionPreference) : reducedMQ.addListener(applyMotionPreference);
updateModeButton(); updateOrbitButton(); updateTrainButton();

/* ==========================================================================
   Render loop
   ========================================================================== */
function renderFrame() {
  renderer.render(scene, camera);
  // OutlineEffect would redraw Points/Sprites in its outline pass (doubling additive glow)
  for (const o of glowObjects) o.userData.wasVisible = o.visible, o.visible = false;
  effect.renderOutline(scene, camera);
  for (const o of glowObjects) o.visible = o.userData.wasVisible;
}
let last = performance.now(), started = false;
document.addEventListener('visibilitychange', () => { last = performance.now(); });
function frame(now) {
  const dt = Math.min(Math.max((now - last) / 1000, 0), 0.1); // clamp large gaps (tab resume)
  last = now;
  simClock += dt;
  updateJourney(dt);
  updateDayNight(dt);
  updatePetals(dt, simClock);
  updateCamera(dt);
  renderFrame();
  if (!started) { started = true; $('loading').classList.add('hidden'); setTimeout(() => $('loading').remove(), 700); }
  requestAnimationFrame(frame);
}
renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); showError('The graphics context was lost. Please reload the page.'); });
requestAnimationFrame(frame);

// Small inspection hook (handy for debugging; harmless otherwise)
window.harukaze = {
  get state() { return { journey: { ...journey }, trainS: train.s, night, nightMix, orbitEnabled, reducedMotion, calls: renderer.info.render.calls, TL: { ...TL }, S_STOP, S0, S_END }; },
  seek(t) { if (!journey.active) startJourney(); journey.t = t; },
  setNight(v) { night = !!v; nightMix = night ? 1 : 0; updateModeButton(); },
  renderer, camera, controls,
};
}
</script>
</body>
