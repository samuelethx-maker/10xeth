<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#171717" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Hoplite</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="device" id="device">
  <!-- Sidebar (sits underneath, revealed when the main panel slides right) -->
  <aside class="drawer" id="drawer" aria-label="Sidebar">
    <header class="drawer-head">
      <button class="org" data-action="org">
        <span class="org-logo">C</span>
        <span class="org-text">
          <span class="org-name">Curiofold <svg class="chev" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5" /></svg></span>
          <span class="org-sub" id="projectLabel">All Projects</span>
        </span>
      </button>
      <button class="icon-btn round" data-action="search" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" /></svg>
      </button>
    </header>
    <div class="search-row" id="searchRow" hidden>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" /></svg>
      <input id="searchInput" placeholder="Search threads" autocomplete="off" />
      <button class="text-btn" data-action="search-close">Cancel</button>
    </div>
    <nav class="drawer-nav">
      <button class="nav-item" data-action="new-thread">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>New thread
      </button>
      <button class="nav-item" data-action="page" data-page="automations">
        <svg viewBox="0 0 24 24"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6L13 3Z" /></svg>Automations
      </button>
      <button class="nav-item" data-action="page" data-page="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg>Settings
      </button>
    </nav>
    <div class="threads-head">
      <span>Threads</span>
      <button class="icon-btn" data-action="sort" aria-label="Sort threads">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M8 12h8M10.5 17h3" /></svg>
      </button>
    </div>
    <ul class="thread-list" id="threadList"></ul>
  </aside>

  <!-- Main panel -->
  <main class="main" id="main">
    <div class="scrim" id="scrim" data-action="close-drawer"></div>

    <!-- Home -->
    <section class="view view-home" id="view-home">
      <header class="topbar">
        <button class="icon-btn round" data-action="toggle-drawer" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" class="sidebar-ico"><rect x="3" y="4" width="18" height="16" rx="3.5" /><path d="M10 4v16" /><path d="M5.8 8h1.8M5.8 11h1.8M5.8 14h1.8" /></svg>
        </button>
        <button class="icon-btn round" data-action="more" aria-label="More">
          <svg viewBox="0 0 24 24" class="fill"><circle cx="5.5" cy="12" r="1.9" /><circle cx="12" cy="12" r="1.9" /><circle cx="18.5" cy="12" r="1.9" /></svg>
        </button>
      </header>
      <div class="hero">
        <img src="knight.png" alt="" class="knight" />
        <h1>Deploy an army.</h1>
      </div>
      <div class="composer-wrap">
        <button class="repo-pill" data-action="repo">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="0.01" /><path d="M6 4v3a5 5 0 0 0 5 5h2a5 5 0 0 0 5-5V4M12 12v8" /></svg>
          <span id="repoLabel">samuelethx-maker/10xeth · main</span>
          <svg class="chev" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5" /></svg>
        </button>
        <form class="composer" id="composer">
          <textarea id="prompt" rows="1" placeholder="Describe a task"></textarea>
          <div class="attachments" id="attachments"></div>
          <div class="composer-bar">
            <button type="button" class="icon-btn" data-action="attach" aria-label="Attach">
              <svg viewBox="0 0 24 24"><path d="m20 11.5-8.1 8.1a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8" /></svg>
            </button>
            <button type="button" class="chip" data-action="model">
              <svg viewBox="0 0 24 24" class="model-ico"><path d="M12 3.2a4.4 4.4 0 0 1 4.3 3.3 4.4 4.4 0 0 1 3.4 5.9 4.4 4.4 0 0 1-3.1 6.7A4.4 4.4 0 0 1 9.5 20a4.4 4.4 0 0 1-5.2-3.6 4.4 4.4 0 0 1-1-6.6A4.4 4.4 0 0 1 7.8 4.4 4.4 4.4 0 0 1 12 3.2Z" /><path d="M9 7.5v6.8l5.8 3.4M15 6.4l-6 3.5M8.6 15l6.2-3.5V18M9 14.3l6-3.4M18 13l-6 3.4M7.5 8.6v6.7" /></svg>
              <span id="modelLabel">GPT-6 Luna</span>
              <svg class="chev" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5" /></svg>
            </button>
            <button type="button" class="chip" data-action="effort">
              <span class="bars" id="effortBars"><i></i><i></i><i></i><i></i><i></i></span>
              <span id="effortLabel">Default</span>
            </button>
            <button type="submit" class="send" id="sendBtn" aria-label="Send">
              <svg viewBox="0 0 24 24" class="send-idle fill"><circle cx="7" cy="15" r="1.6" /><circle cx="12" cy="10" r="1.6" /><circle cx="17" cy="15" r="1.6" /></svg>
              <svg viewBox="0 0 24 24" class="send-ready"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- Thread detail -->
    <section class="view view-thread" id="view-thread" hidden>
      <header class="topbar bordered">
        <button class="icon-btn round" data-action="toggle-drawer" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" class="sidebar-ico"><rect x="3" y="4" width="18" height="16" rx="3.5" /><path d="M10 4v16" /><path d="M5.8 8h1.8M5.8 11h1.8M5.8 14h1.8" /></svg>
        </button>
        <div class="topbar-title">
          <div class="tt-main" id="threadTitle"></div>
          <div class="tt-sub" id="threadSub"></div>
        </div>
        <button class="icon-btn round" data-action="thread-more" aria-label="Thread actions">
          <svg viewBox="0 0 24 24" class="fill"><circle cx="5.5" cy="12" r="1.9" /><circle cx="12" cy="12" r="1.9" /><circle cx="18.5" cy="12" r="1.9" /></svg>
        </button>
      </header>
      <div class="messages" id="messages"></div>
      <form class="composer compact" id="replyComposer">
        <textarea id="reply" rows="1" placeholder="Reply to Hoplite"></textarea>
        <button type="submit" class="send" aria-label="Send reply">
          <svg viewBox="0 0 24 24" class="send-ready"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
        </button>
      </form>
    </section>

    <!-- Simple pages -->
    <section class="view view-page" id="view-page" hidden>
      <header class="topbar bordered">
        <button class="icon-btn round" data-action="toggle-drawer" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" class="sidebar-ico"><rect x="3" y="4" width="18" height="16" rx="3.5" /><path d="M10 4v16" /><path d="M5.8 8h1.8M5.8 11h1.8M5.8 14h1.8" /></svg>
        </button>
        <div class="topbar-title"><div class="tt-main" id="pageTitle"></div></div>
        <span class="icon-btn-spacer"></span>
      </header>
      <div class="page-body" id="pageBody"></div>
    </section>
  </main>

  <!-- Bottom sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" data-action="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grabber"></div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" multiple hidden />
</div>
<script src="app.js"></script>
</body>
</html>
