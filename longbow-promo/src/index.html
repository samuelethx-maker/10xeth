function V(name,sec,loop=true){const [id,n]=CLIP[name];let f=Math.floor(sec*30);f=loop?((f%n)+n)%n:cl(f,0,n-1);
  const src=`stock/f_${id}/${String(f+1).padStart(4,'0')}.jpg`;if(collecting){need.add(src);return null}return IMG[src]}
function cover(img,x,y,w,h,zoom=1,px=.5,py=.5){if(!img)return;const s=Math.max(w/img.width,h/img.height)*zoom,iw=img.width*s,ih=img.height*s;

function line(segs,x,y,size,t,t0,o={}){
  const st=o.stagger??.07,du=o.dur??.7,out=o.out;
  const ws=[];segs.forEach(([s,f,c])=>{ctx.font=f;s.split(' ').forEach(w=>w&&ws.push({w,f,c,wd:ctx.measureText(w).width}))});
  ctx.font=segs[0][1];const sp=ctx.measureText(' ').width*.95;

  ctx.save();ctx.beginPath();ctx.rect(0,y-size*1.05,W,size*1.4);ctx.clip();ctx.textBaseline='alphabetic';
  ws.forEach((w,i)=>{const ti=o.times?o.times[i]:t0+i*st;

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function pill(txt,x,y,o={}){
